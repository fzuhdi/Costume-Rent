services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${BUSANA_CONTAINER_PREFIX:-busana}_backend
    restart: unless-stopped
    env_file: .env.production
    environment:
      - APP_ENV=development
    ports:
      - "${BACKEND_HOST_PORT:-8081}:8080"
    volumes:
      - busana_db:/app/data
      - ./backend/uploads:/app/uploads
    networks:
      - busana_net
    develop:
      watch:
        - action: rebuild          # recompile Go binary on any source change
          path: ./backend
          ignore:
            - uploads/
            - "*.db"

  sqlite-web:
    image: coleifer/sqlite-web
    container_name: ${BUSANA_CONTAINER_PREFIX:-busana}_sqlite_web
    restart: unless-stopped
    ports:
      - "${SQLITE_WEB_HOST_PORT:-8080}:8080"
    volumes:
      - busana_db:/data
    environment:
      SQLITE_DATABASE: busana_tari.db
    depends_on:
      - backend
    networks:
      - busana_net

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: >
      sh -c "LOCK_HASH=$$(sha256sum package-lock.json | cut -d ' ' -f1); if [ ! -d node_modules/.bin ] || [ ! -f node_modules/.costume-rent-lock-hash ] || [ \"$$LOCK_HASH\" != \"$$(cat node_modules/.costume-rent-lock-hash)\" ]; then npm ci && printf '%s' \"$$LOCK_HASH\" > node_modules/.costume-rent-lock-hash; fi && npm run dev -- --host 0.0.0.0 --port ${VITE_DEV_PORT:-5173}"
    environment:
      - VITE_DEV_PORT=${VITE_DEV_PORT:-5173}
    volumes:
      - ./frontend:/app              # mount full source
      - busana_frontend_node_modules:/app/node_modules # keep container's node_modules isolated
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:${VITE_DEV_PORT:-5173}"
    depends_on:
      - backend
    networks:
      - busana_net
    develop:
      watch:
        - action: sync               # Vite sees the file change → HMR in browser
          path: ./frontend/src
          target: /app/src
        - action: rebuild            # reinstall when deps change
          path: ./frontend/package.json

volumes:
  busana_db:
    name: ${BUSANA_DB_VOLUME:-busana_db}
  busana_frontend_node_modules:
    name: ${BUSANA_FRONTEND_NODE_MODULES_VOLUME:-busana_frontend_node_modules}

networks:
  busana_net:
    driver: bridge
