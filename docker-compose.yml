version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: busana_backend
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - busana_db:/app/data
      - busana_uploads:/app/uploads
    networks:
      - busana_net
    develop:
      watch:
        - action: rebuild          # recompile Go binary on any source change
          path: ./backend
          ignore:
            - uploads/
            - "*.db"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: busana_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - busana_net
    develop:
      watch:
        - action: sync             # push changed files into container instantly
          path: ./frontend/src
          target: /usr/share/nginx/html/src
        - action: rebuild          # full rebuild when deps change
          path: ./frontend/package.json

volumes:
  busana_db:
    name: busana_db
  busana_uploads:
    name: busana_uploads

networks:
  busana_net:
    driver: bridge