version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: busana_backend
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - busana_db:/app/busana_tari.db
      - busana_uploads:/app/uploads
    networks:
      - busana_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: busana_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - busana_net

volumes:
  busana_db:
    name: busana_db
  busana_uploads:
    name: busana_uploads

networks:
  busana_net:
    driver: bridge