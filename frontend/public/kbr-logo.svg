<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="glow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e1b4b" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="128" fill="url(#bg)" />

  <g transform="translate(256, 220)" filter="url(#glow)">
    <!-- Hanger hook and body -->
    <path d="M 0 -110 
             C -45 -110, -45 -50, 0 -50 
             C 30 -50, 30 -30, 0 -10 
             L -150 70 
             C -165 78, -160 100, -140 100 
             L 140 100 
             C 160 100, 165 78, 150 70 
             L 0 -10" 
          fill="none" stroke="url(#accent)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Hook endpoint -->
    <circle cx="-28" cy="-88" r="14" fill="url(#accent)"/>
    
    <!-- Sparkles -->
    <path d="M 110 -90 L 115 -70 L 135 -65 L 115 -60 L 110 -40 L 105 -60 L 85 -65 L 105 -70 Z" fill="url(#accent)"/>
    <path d="M -100 -10 L -95 0 L -85 5 L -95 10 L -100 20 L -105 10 L -115 5 L -105 0 Z" fill="url(#accent)"/>
    
    <text x="0" y="170" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="56" fill="white" text-anchor="middle" letter-spacing="1">KBR</text>
    <text x="0" y="210" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="22" fill="#a5b4fc" text-anchor="middle" letter-spacing="5">COSTUME</text>
  </g>
</svg>
